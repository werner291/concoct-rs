name: CI

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Build
        run: nix build

      - name: Run all checks
        run: |
          sudo chmod 666 /dev/kvm
          nix flake check
