[package]
name = "concoct"
version = "0.1.0"
edition = "2021"

[lib]
name = "concoct"
path = "src/lib.rs"
# cdylib is only built when the "python" feature is active (for PyO3)
crate-type = ["lib", "cdylib"]

[features]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
rayon = "1"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
numpy = { version = "0.23", optional = true }

[[bin]]
name = "concoct"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dev-dependencies]
proptest = "1"
rayon = "1"
num_cpus = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_leaf"
harness = false
